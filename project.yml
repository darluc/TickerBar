name: TickerBar
options:
  bundleIdPrefix: app.tickerbar
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 TickerBar contributors"
    COMBINE_HIDPI_IMAGES: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  TickerBar:
    type: application
    platform: macOS
    sources:
      - path: TickerBar
        excludes:
          - "**/.DS_Store"
    resources:
      - path: TickerBar/Resources
    info:
      path: TickerBar/Resources/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.finance
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "$(BUNDLE_DISPLAY_NAME)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleLocalizations:
          - zh-Hans
          - en
        CFBundleDevelopmentRegion: zh-Hans
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        PRODUCT_MODULE_NAME: TickerBar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.tickerbar.TickerBar.debug
          PRODUCT_NAME: TickerBar-Dev
          BUNDLE_DISPLAY_NAME: TickerBar Dev
          CODE_SIGN_ENTITLEMENTS: TickerBar/Resources/TickerBar-Debug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.tickerbar.TickerBar
          PRODUCT_NAME: TickerBar
          BUNDLE_DISPLAY_NAME: TickerBar
          CODE_SIGN_ENTITLEMENTS: TickerBar/Resources/TickerBar.entitlements
    dependencies:
      - package: GRDB

  TickerBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TickerBarTests
    dependencies:
      - target: TickerBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.tickerbar.TickerBarTests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TickerBar-Dev.app/Contents/MacOS/TickerBar-Dev"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TickerBar.app/Contents/MacOS/TickerBar"

schemes:
  TickerBar:
    build:
      targets:
        TickerBar: all
        TickerBarTests: [test]
    test:
      config: Debug
      targets:
        - TickerBarTests
    run:
      config: Debug
    archive:
      config: Release
